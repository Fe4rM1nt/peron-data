name: Update Polish train data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
concurrency:
  group: peron-data-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Verify date and rolling-stock parsers
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Fetch GTFS and KM PDF assignments
        run: python scripts/update_data.py
      - name: Save validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/peron.json data/stations.json data/boards
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Daily GTFS and KM rolling stock update'
          git pull --rebase origin main
          git push origin HEAD:main
